<title id="title">숏츠 제작 에이전트팀의 로컬 실행 구조</title><desc id="desc">입력, 기획, 별도 기획 승인, 액션과 비주얼 연출, 프롬프트와 가상 견적, 별도 제작 승인, 로컬 합성과 검사, 사람 확인과 수정 재승인 흐름. 예시 큐레이션과 실제 모델은 미연결.</desc>
